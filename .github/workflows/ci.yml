# CI mínima do O Razão (beta.21/21.1 — decisões D-013 e D-016).
# Executa npm ci, npm test e npm run build em Ubuntu e Windows, com duas versões
# de Node compatíveis com "engines" (>=22.12.0). Usa somente fixtures sintéticas;
# não publica artefatos, não usa segredos e não baixa o binário do Electron.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.12.0', '24.x']
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versões
        run: |
          node --version
          npm --version

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build Web
        run: npm run build
